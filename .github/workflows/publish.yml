name: Publish

# Publishes the package to PyPI when a GitHub Release is published.
# Requires repo secret PYPI_API_TOKEN (a PyPI API token).
# Skips gracefully (no failure) until that secret is configured.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::PYPI_API_TOKEN not configured — skipping publish. Add it in repo Settings → Secrets to enable."
            exit 0
          fi
          twine upload dist/*
