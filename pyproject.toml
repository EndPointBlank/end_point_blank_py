[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "end-point-blank-py"
version = "0.12.0"
description = "Python SDK for EndPointBlank (Django, Flask, WSGI): authorize service-to-service API calls, report endpoint versions, and see which clients still call deprecated API versions."
authors = [{ name = "Robert A. Lasch", email = "rlasch@gmail.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
]
keywords = [
    "endpointblank",
    "api-versioning",
    "api-deprecation",
    "deprecation",
    "sunset",
    "api-lifecycle",
    "machine-to-machine",
    "m2m-auth",
    "api-audit-log",
    "django",
    "flask",
    "wsgi",
]
dependencies = [
    "requests>=2.33",
]

[project.urls]
Homepage = "https://endpointblank.com"
Documentation = "https://endpointblank.com/docs/sdk-setup"
Source = "https://github.com/EndPointBlank/end_point_blank_py"
Issues = "https://github.com/EndPointBlank/end_point_blank_py/issues"

[project.optional-dependencies]
flask = ["flask>=2.3"]
django = ["django>=4.2"]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
    "responses>=0.23",
    "flask>=2.3",
    "django>=4.2",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["end_point_blank"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Lines that cannot be reached by a test are excluded explicitly rather than
# left to drag the number down — an unexplained gap is indistinguishable from
# an untested one.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
