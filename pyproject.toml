[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "end-point-blank-py"
version = "0.3.0"
description = "Python library for EndPointBlank API integration - endpoint tracking, authorization, and error reporting"
authors = [{ name = "Robert A. Lasch", email = "rlasch@gmail.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
]
dependencies = [
    "requests>=2.33",
]

[project.optional-dependencies]
flask = ["flask>=2.3"]
django = ["django>=4.2"]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
    "responses>=0.23",
    "flask>=2.3",
    "django>=4.2",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["end_point_blank"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Lines that cannot be reached by a test are excluded explicitly rather than
# left to drag the number down — an unexplained gap is indistinguishable from
# an untested one.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
